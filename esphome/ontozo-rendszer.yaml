    inverted: true
    restore_mode: ALWAYS_OFF      # MÓDOSÍTVA: egységesen, mint a többi kimenet

  - platform: gpio
    id: irrigation_channel1
    pin: GPIO25
    inverted: true
    restore_mode: ALWAYS_OFF


#
# Scripts
#
script:
  - id: turn_off_pump_if_valves_are_closed
    then:
      - if:
          condition:
            and:
              - switch.is_off: irrigation_channel1
              - switch.is_off: irrigation_channel2
              - switch.is_off: irrigation_channel3
              - switch.is_off: irrigation_channel4
              - switch.is_off: irrigation_channel5
              - switch.is_off: irrigation_channel6
          then:
            - if:
                condition:
                  not:
                    script.is_running: manual_pump_wait
                then:
                  - switch.turn_off: irrigation_pump
                  - script.stop: manual_pump_wait

  - id: turn_off_valves_and_pump
    then:
      - lambda: |-
          // MÓDOSÍTVA: a várakozó zónák is törlődnek
          for (int i = 0; i < 6; i++) id(var_pending)[i] = false;
      - switch.turn_off: irrigation_manual
      - switch.turn_off: irrigation_zone1
      - switch.turn_off: irrigation_zone2
      - switch.turn_off: irrigation_zone3
      - switch.turn_off: irrigation_zone4
      - switch.turn_off: irrigation_zone5
      - switch.turn_off: irrigation_zone6

  - id: manual_pump_wait
    then:
      - lambda: |-
          id(var_pump_remaining) = id(var_pump_duration);
          id(manual_remaining).update();
      - while:
          condition:
            lambda: "return id(var_pump_remaining) > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_pump_remaining) -= 1;
                id(manual_remaining).update();
  - id: zone1_wait
    then:
      - lambda: |-
          id(var_zone_remainings)[0] = id(zone1_duration).state  * id(time_multiplier).state / 100;
          id(zone1_remaining).update();
      - while:
          condition:
            lambda: "return id(var_zone_remainings)[0] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zone_remainings)[0] -= 1;
                id(zone1_remaining).update();
  - id: zone2_wait
    then:
      - lambda: |-
          id(var_zone_remainings)[1] = id(zone2_duration).state  * id(time_multiplier).state / 100;
          id(zone2_remaining).update();
      - while:
          condition:
            lambda: "return id(var_zone_remainings)[1] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zone_remainings)[1] -= 1;
                id(zone2_remaining).update();
  - id: zone3_wait
    then:
      - lambda: |-
          id(var_zone_remainings)[2] = id(zone3_duration).state  * id(time_multiplier).state / 100;
          id(zone3_remaining).update();
      - while:
          condition:
            lambda: "return id(var_zone_remainings)[2] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zone_remainings)[2] -= 1;
                id(zone3_remaining).update();
  - id: zone4_wait
    then:
      - lambda: |-
          id(var_zone_remainings)[3] = id(zone4_duration).state  * id(time_multiplier).state / 100;
          id(zone4_remaining).update();
      - while:
          condition:
            lambda: "return id(var_zone_remainings)[3] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zone_remainings)[3] -= 1;
                id(zone4_remaining).update();
  - id: zone5_wait
    then:
      - lambda: |-
          id(var_zone_remainings)[4] = id(zone5_duration).state  * id(time_multiplier).state / 100;
          id(zone5_remaining).update();
      - while:
          condition:
            lambda: "return id(var_zone_remainings)[4] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zone_remainings)[4] -= 1;
                id(zone5_remaining).update();
  - id: zone6_wait
    then:
      - lambda: |-
          id(var_zone_remainings)[5] = id(zone6_duration).state  * id(time_multiplier).state / 100;
          id(zone6_remaining).update();
      - while:
          condition:
            lambda: "return id(var_zone_remainings)[5] > 0;"
          then:
            - delay: 1min
            - lambda: |-
                id(var_zone_remainings)[5] -= 1;
                id(zone6_remaining).update();

#
# Time automations
#
interval:
  - interval: 1sec
    then:
      - lambda: |-
          // MÓDOSÍTVA: ütemező várakozási sorral
          // automatizálás főkapcsolója: kikapcsolva a várakozó zónák is törlődnek
          if (!id(automation_enabled).state) {
            for (int i = 0; i < 6; i++) id(var_pending)[i] = false;
            return;
          }

          // érvényes idő nélkül nem indítunk (újraindulás után 1970. január 1. lenne)
          auto now = id(hass_time).now();
          if (!now.is_valid()) return;

          // kihagyott napok: két öntözési nap között skip_days nap marad ki
          int current_day = now.timestamp / 86400;
          if ((current_day - id(var_skip_start_day)) % ((int) id(skip_days).state + 1) != 0) return;

          std::string hhmm = now.strftime("%H:%M");
          int stamp = current_day * 1440 + now.hour * 60 + now.minute;

          esphome::switch_::Switch *zone[6] = {id(irrigation_zone1), id(irrigation_zone2), id(irrigation_zone3),
                                               id(irrigation_zone4), id(irrigation_zone5), id(irrigation_zone6)};
          esphome::switch_::Switch *enabled[6] = {id(zone1_enabled), id(zone2_enabled), id(zone3_enabled),
                                                  id(zone4_enabled), id(zone5_enabled), id(zone6_enabled)};
          esphome::select::Select *start[6] = {id(zone1_start), id(zone2_start), id(zone3_start),
                                               id(zone4_start), id(zone5_start), id(zone6_start)};
          esphome::number::Number *duration[6] = {id(zone1_duration), id(zone2_duration), id(zone3_duration),
                                                  id(zone4_duration), id(zone5_duration), id(zone6_duration)};

          bool busy = false;
          for (int i = 0; i < 6; i++) {
            // 1) a kezdési percben egyszer kerül sorba, és csak ha legalább 1 percig futna
            if (enabled[i]->state && hhmm == start[i]->state && id(var_last_start)[i] != stamp) {
              id(var_last_start)[i] = stamp;
              if (duration[i]->state * id(time_multiplier).state / 100 >= 1)
                id(var_pending)[i] = true;
            }
            if (!enabled[i]->state) id(var_pending)[i] = false;  // közben letiltott zóna
            if (zone[i]->state) busy = true;
          }

          // 2) egyszerre csak egy zóna fut: ha egyik sem fut, a sorban következő indul
          if (!busy) {
            for (int i = 0; i < 6; i++) {
              if (id(var_pending)[i] && enabled[i]->state) {
                id(var_pending)[i] = false;
                zone[i]->turn_on();
                break;
              }
            }
          }

