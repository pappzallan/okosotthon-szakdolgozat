# Öntözővezérlő – javított változat (2026. október)
# Módosítások a korábbihoz képest (a "# MÓDOSÍTVA" megjegyzések mutatják):
#  1. várakozási sor: egyszerre csak egy zóna fut, az átfedő kezdési idők sorban követik egymást
#  2. egy percnél rövidebb időtartamnál a zóna el sem indul (korábban másodpercenként újraindult)
#  3. érvénytelen idő (pl. újraindulás után, Home Assistant nélkül) esetén nincs indítás
#  4. tartalék időforrás (SNTP), ha a Home Assistant nem elérhető
#  5. a kulcsok és jelszavak a secrets.yaml-ből jönnek, a webfelület jelszót kér
esphome:
  name: ontozo-rendszer
  friendly_name: Ontozo Rendszer

esp32:
  board: esp32dev
  framework:
    type: arduino

preferences:
  flash_write_interval: 1min

time:
  - platform: homeassistant
    id: hass_time
  - platform: sntp                # MÓDOSÍTVA: tartalék időforrás
    id: sntp_time

globals:
  - id: var_pump_duration
    type: int
    initial_value: "60"
  - id: var_pump_remaining
    type: int
    initial_value: "0"
  - id: var_zone_remainings
    type: int[6]
    initial_value: "{0, 0, 0, 0, 0, 0}"
  - id: var_skip_start_day
    type: int
    restore_value: true
    initial_value: "0"
  # MÓDOSÍTVA: várakozó zónák és az utolsó indítás perce zónánként
  - id: var_pending
    type: bool[6]
    initial_value: "{false, false, false, false, false, false}"
  - id: var_last_start
    type: int[6]
    initial_value: "{-1, -1, -1, -1, -1, -1}"

# Enable logging
logger:

# Enable Home Assistant API
api:
  reboot_timeout: 0s
  encryption:
    key: !secret ontozo_api_key       # MÓDOSÍTVA

ota:
  - platform: esphome
    password: !secret ontozo_ota_password   # MÓDOSÍTVA

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ontozo-Rendszer Fallback Hotspot"
    password: !secret ontozo_ap_password    # MÓDOSÍTVA

captive_portal:

web_server:
  port: 80
  auth:                           # MÓDOSÍTVA: a webfelület jelszót kér
    username: !secret web_user
    password: !secret web_password

button:
  - platform: restart
    id: irrigation_restart
    name: "Irrigation Restart"


binary_sensor:
  # Connection status
  - platform: status
    name: "Irrigation Status"

  # Manual switch sensor
  - platform: gpio
    id: manual_gpio
    pin:
      number: GPIO23
      mode: INPUT_PULLDOWN
    on_click:
      - max_length: 2s
        then:
          - switch.toggle: irrigation_manual
      - min_length: 2s
        max_length: 5s
        then:
          - switch.turn_off: automation_enabled
          - script.execute: turn_off_valves_and_pump
      - min_length: 5s
        max_length: 10s
        then:
          - switch.turn_on: automation_enabled
  
select:
  - platform: template
    name: "Zone 1 start"
    id: zone1_start
    options: &start_options
      ["00:00", "00:15", "00:30", "00:45",
       "01:00", "01:15", "01:30", "01:45",
       "02:00", "02:15", "02:30", "02:45",
       "03:00", "03:15", "03:30", "03:45",
       "04:00", "04:15", "04:30", "04:45",
       "05:00", "05:15", "05:30", "05:45",
       "06:00", "06:15", "06:30", "06:45",
       "07:00", "07:15", "07:30", "07:45",
       "08:00", "08:15", "08:30", "08:45",
       "09:00", "09:15", "09:30", "09:45",
       "10:00", "10:15", "10:30", "10:45",
       "11:00", "11:15", "11:30", "11:45",
       "12:00", "12:15", "12:30", "12:45",
       "13:00", "13:15", "13:30", "13:45",
       "14:00", "14:15", "14:30", "14:45",
       "15:00", "15:15", "15:30", "15:45",
       "16:00", "16:15", "16:30", "16:45",
       "17:00", "17:15", "17:30", "17:45",
       "18:00", "18:15", "18:30", "18:45",
       "19:00", "19:15", "19:30", "19:45",
       "20:00", "20:15", "20:30", "20:45",
       "21:00", "21:15", "21:30", "21:45",
       "22:00", "22:15", "22:30", "22:45",
       "23:00", "23:15", "23:30", "23:45",
      ]
    initial_option: "20:00"
    optimistic: true
    restore_value: true
  - platform: template
    name: "Zone 2 start"
    id: zone2_start
    options: *start_options
    initial_option: "18:00"
    optimistic: true
    restore_value: true
  - platform: template
    name: "Zone 3 start"
    id: zone3_start
    options: *start_options
    initial_option: "20:30"
    optimistic: true
    restore_value: true
  - platform: template
    name: "Zone 4 start"
    id: zone4_start
    options: *start_options
    initial_option: "19:30"
    optimistic: true
    restore_value: true
  - platform: template
    name: "Zone 5 start"
    id: zone5_start
    options: *start_options
    initial_option: "18:45"
    optimistic: true
    restore_value: true
  - platform: template
    name: "Zone 6 start"
    id: zone6_start
    options: *start_options
    initial_option: "17:15"
    optimistic: true
    restore_value: true


number:
  - platform: template
    id: zone1_duration
    name: "Zone 1 duration"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 30
    unit_of_measurement: min
    optimistic: true
    restore_value: true
  - platform: template
    id: zone2_duration
    name: "Zone 2 duration"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 45
    unit_of_measurement: min
    optimistic: true
    restore_value: true
  - platform: template
    id: zone3_duration
    name: "Zone 3 duration"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 30
    unit_of_measurement: min
    optimistic: true
    restore_value: true
  - platform: template
    id: zone4_duration
    name: "Zone 4 duration"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 30
    unit_of_measurement: min
    optimistic: true
    restore_value: true
  - platform: template
    id: zone5_duration
    name: "Zone 5 duration"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 30
    unit_of_measurement: min
    optimistic: true
    restore_value: true
  - platform: template
    id: zone6_duration
    name: "Zone 6 duration"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 45
    unit_of_measurement: min
    optimistic: true
    restore_value: true

  - platform: template
    id: time_multiplier
    name: "Time Multiplier"
    step: 1
    min_value: 0
    max_value: 120
    initial_value: 100
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true


  - platform: template
    id: skip_days
    name: "Skip Days"
    step: 1
    min_value: 0
    max_value: 10
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      then:
        - lambda: |-
            id(var_skip_start_day) = id(hass_time).now().timestamp / 86400;

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

  - platform: wifi_signal
    name: "Irrigation Wifi"
    update_interval: 60s
  #
  # Template Sensors
  #
  - platform: template
    id: manual_remaining
    name: "Manual pump remaining"
    accuracy_decimals: 0
    unit_of_measurement: min
    lambda: "return id(var_pump_remaining);"
  - platform: template
    id: zone1_remaining
    name: "Zone 1 remaining"
    accuracy_decimals: 0
    unit_of_measurement: min
    lambda: "return id(var_zone_remainings)[0];"
  - platform: template
    id: zone2_remaining
    name: "Zone 2 remaining"
    accuracy_decimals: 0
    unit_of_measurement: min
    lambda: "return id(var_zone_remainings)[1];"
  - platform: template
    id: zone3_remaining
    name: "Zone 3 remaining"
    accuracy_decimals: 0
    unit_of_measurement: min
    lambda: "return id(var_zone_remainings)[2];"
  - platform: template
    id: zone4_remaining
    name: "Zone 4 remaining"
    accuracy_decimals: 0
    unit_of_measurement: min
    lambda: "return id(var_zone_remainings)[3];"
  - platform: template
    id: zone5_remaining
    name: "Zone 5 remaining"
    accuracy_decimals: 0
    unit_of_measurement: min
